---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: minecraft-rm7
    includeTemplates: true
    includeSelectors: true
  - pairs:
      app.kubernetes.io/part-of: minecraft-rm7
      app.kubernetes.io/managed-by: kustomize
    includeTemplates: true

namespace: minecraft-rm7
resources:
  - namespace.yml
  - pv.yml
  - deployment.yml
  - service.yml

images:
  - name: itzg/minecraft
    newName: ghcr.io/itzg/minecraft-server
    newTag: 2026.7.2-java17
