---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minecraft-rm7-data-pv
spec:
  local:
    path: /mnt/rootfs/@apps/@minecraft-rm7/data
  capacity: { storage: 20Gi }
  accessModes: [ReadWriteOncePod]
  storageClassName: ''
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions: [{ key: kubernetes.io/hostname, operator: In, values: [coruscant] }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data-pvc
spec:
  volumeName: minecraft-rm7-data-pv
  storageClassName: ''
  accessModes: [ReadWriteOncePod]
  resources: { requests: { storage: 20Gi } }
