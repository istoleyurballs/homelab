---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: minecraft-gtnh
    includeTemplates: true
    includeSelectors: true
  - pairs:
      app.kubernetes.io/part-of: minecraft-gtnh
      app.kubernetes.io/managed-by: kustomize
    includeTemplates: true

namespace: minecraft-gtnh
resources:
  - namespace.yml
  - pv.yml
  - deployment.yml
  - service.yml

configMapGenerator:
  - name: minecraft-gtnh-cm
    files:
      - server-icon.png=server-icon.png

images:
  - name: minecraft-gtnh
    newName: ghcr.io/itzg/minecraft-server
    newTag: 2026.9.1-java25-graalvm@sha256:6d055d6b9865fd4adbfea4496fb86d9e254fcf80ffaa9e61ce73f8f61ca53e0e
